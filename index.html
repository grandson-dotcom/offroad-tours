    <script>
      // Defensive handler for window.fetch property assignments in strict sandboxes
      try {
        const desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
        if (desc && !desc.set && desc.configurable) {
          let customFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get() { return customFetch; },
            set(fn) { customFetch = fn; },
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {}
    </script>
